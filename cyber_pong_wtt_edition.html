<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CYBER PONG: ЧМЗ СИНДИКАТ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background-color: #030303; color: #0ff;
            font-family: 'Press Start 2P', monospace;
        }

        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
        }

        .glitch-text { text-shadow: 2px 0 #f0f, -2px 0 #0ff; }

        .neon-border {
            border: 2px solid #0ff; box-shadow: 0 0 12px rgba(0,255,255,0.4), inset 0 0 10px rgba(0,255,255,0.2);
            background: rgba(0, 15, 15, 0.85); backdrop-filter: blur(4px);
        }
        
        .neon-border-pink {
            border: 2px solid #f0f; box-shadow: 0 0 12px rgba(255,0,255,0.4), inset 0 0 10px rgba(255,0,255,0.2);
            background: rgba(15, 0, 15, 0.85); backdrop-filter: blur(4px);
        }

        .neon-btn {
            background: transparent; border: 2px solid #0ff; color: #0ff;
            text-transform: uppercase; cursor: pointer; transition: 0.2s;
            box-shadow: 0 0 5px #0ff;
        }
        .neon-btn:active, .neon-btn.active { background: #0ff; color: #000; box-shadow: 0 0 20px #0ff; }

        .neon-btn-pink { border-color: #f0f; color: #f0f; box-shadow: 0 0 5px #f0f; }
        .neon-btn-pink:active { background: #f0f; color: #000; box-shadow: 0 0 20px #f0f; }

        #loading-screen, #main-menu, #game-ui, #game-over { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; }
        #canvas-container { position: absolute; inset: 0; z-index: 1; }
        
        .hidden { display: none !important; }

        .vfx-text {
            position: absolute; font-size: 1.5rem; pointer-events: none; z-index: 50;
            animation: floatUp 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 1; }
            100% { transform: translateY(-60px) scale(1.4); opacity: 0; }
        }
        
        .shake { animation: shake-anim 0.25s ease-in-out; }
        @keyframes shake-anim {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(-4px, 4px) rotate(-1deg); }
            40% { transform: translate(4px, -4px) rotate(1deg); }
            60% { transform: translate(-4px, -4px); }
            80% { transform: translate(4px, 4px); }
        }

        .speech-bubble {
            transition: top 0.1s, left 0.1s;
            animation: pop-bubble 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            box-shadow: 4px 4px 0px rgba(0, 255, 255, 0.6);
        }
        .speech-bubble.pink-shadow { box-shadow: 4px 4px 0px rgba(255, 0, 255, 0.6); }
        @keyframes pop-bubble {
            0% { transform: translate(-50%, -100%) scale(0); opacity: 0; }
            100% { transform: translate(-50%, -100%) scale(1); opacity: 1; }
        }
        .bubble-tail::after {
            content: ''; position: absolute; bottom: -8px; 
            left: calc(50% + var(--tail-shift, 0px));
            margin-left: -8px; border-width: 8px 8px 0;
            border-style: solid; border-color: #fff transparent transparent transparent;
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>

    <!-- 1. ЭКРАН ЗАГРУЗКИ -->
    <div id="loading-screen" class="justify-center items-center bg-black">
        <h1 class="text-2xl sm:text-4xl glitch-text mb-8 text-center leading-loose">СИНДИКАТ<br>ЧМЗ</h1>
        <div class="w-64 border-2 border-cyan-400 p-1">
            <div id="loading-bar" class="h-4 bg-cyan-400 w-0 transition-all duration-100"></div>
        </div>
        <p id="loading-text" class="mt-4 text-xs text-cyan-400 animate-pulse">Инициализация графического движка v4.0...</p>
    </div>

    <!-- 2. ГЛАВНОЕ МЕНЮ -->
    <div id="main-menu" class="hidden justify-center items-center bg-black/80 p-4">
        <h1 class="text-3xl sm:text-5xl glitch-text mb-2 text-center">CYBER PONG</h1>
        <h2 class="text-xs sm:text-sm text-pink-500 mb-12 text-center">WTT PROTOCOL v4.0 (RTX ON)</h2>
        
        <div class="w-full max-w-md neon-border p-6 flex flex-col gap-6">
            <h3 class="text-center text-sm text-yellow-400">ВЫБЕРИТЕ УРОВЕНЬ ДОСТУПА:</h3>
            
            <button class="diff-btn neon-btn py-4 text-xs sm:text-sm" data-diff="0">НОВИЧОК (Легко)</button>
            <button class="diff-btn neon-btn py-4 text-xs sm:text-sm active bg-cyan-400 text-black" data-diff="1">ЛЮБИТЕЛЬ (Норма)</button>
            <button class="diff-btn neon-btn py-4 text-xs sm:text-sm" data-diff="2">МАСТЕР (Хардкор)</button>
            
            <button id="start-btn" class="neon-btn-pink py-4 text-sm mt-4">ПОДКЛЮЧИТЬСЯ</button>
        </div>
    </div>

    <!-- 3. ИГРОВОЙ UI -->
    <div id="game-ui" class="hidden pointer-events-none p-2 sm:p-4 justify-between">
        <div class="flex justify-between items-start w-full gap-2">
            <div class="neon-border p-2 sm:p-4 flex flex-col items-center flex-1 max-w-[120px]">
                <span class="text-[10px] sm:text-xs text-cyan-400 mb-2">ПОЛЬЗОВАТЕЛЬ</span>
                <span id="score-player" class="text-2xl sm:text-4xl text-white glitch-text">0</span>
            </div>
            
            <div class="neon-border p-2 flex-1 text-center flex flex-col justify-center min-h-[60px]">
                <span id="system-msg" class="text-[8px] sm:text-[10px] text-yellow-400 leading-relaxed">ОЖИДАНИЕ...</span>
            </div>

            <div class="neon-border-pink p-2 sm:p-4 flex flex-col items-center flex-1 max-w-[120px]">
                <span id="bot-name" class="text-[10px] sm:text-xs text-pink-500 mb-2 text-center">БОТ-Н3ЙРО</span>
                <span id="score-ai" class="text-2xl sm:text-4xl text-white glitch-text">0</span>
            </div>
        </div>

        <div class="w-full text-center mb-8 pointer-events-none">
            <span id="serve-msg" class="text-[10px] sm:text-xs text-cyan-400 bg-black/80 p-2 border border-cyan-400 animate-pulse hidden shadow-[0_0_10px_#0ff]">ТАПНИ ДЛЯ ПОДБРОСА МЯЧА</span>
        </div>
        
        <div class="absolute bottom-4 left-2 right-2 flex justify-between items-end pointer-events-auto z-40">
            <button id="menu-exit-btn" class="neon-btn-pink px-3 py-2 text-[10px] sm:text-xs">В МЕНЮ</button>
            <div class="flex flex-col items-end gap-1 neon-border p-2 rounded">
                <div class="flex items-center gap-2">
                    <span class="text-[8px] text-cyan-400">ГРОМКОСТЬ:</span>
                    <input id="volume-slider" type="range" min="0" max="1" step="0.05" value="0.15" class="w-20 accent-cyan-400">
                </div>
                <button id="music-btn" class="neon-btn px-3 py-2 text-[10px] sm:text-xs w-full">МАРТЕНОВСКАЯ ПЕЧЬ (SYNTH)</button>
            </div>
        </div>
    </div>

    <!-- 4. ЭКРАН КОНЦА МАТЧА -->
    <div id="game-over" class="hidden justify-center items-center bg-black/90 backdrop-blur-md z-50 p-4">
        <div class="neon-border p-8 flex flex-col items-center text-center w-full max-w-md">
            <h2 id="result-title" class="text-3xl sm:text-4xl glitch-text mb-4">СИСТЕМА ВЗЛОМАНА</h2>
            <p id="result-desc" class="text-xs sm:text-sm text-yellow-400 mb-8 leading-loose">Матч завершен.</p>
            <button id="restart-btn" class="neon-btn py-4 px-8 text-sm w-full pointer-events-auto">ПЕРЕЗАГРУЗИТЬ СЕССИЮ</button>
            <button id="menu-btn" class="neon-btn-pink py-4 px-8 text-sm w-full mt-4 pointer-events-auto">В ГЛАВНОЕ МЕНЮ</button>
        </div>
    </div>

    <!-- Облачка со шутками -->
    <div id="bubble-1" class="hidden absolute z-30 bg-white text-black p-2 rounded-md border-2 border-cyan-400 text-[9px] sm:text-xs font-bold max-w-[160px] text-center speech-bubble bubble-tail pointer-events-none" style="margin-top: -20px;"></div>
    <div id="bubble-2" class="hidden absolute z-30 bg-white text-black p-2 rounded-md border-2 border-pink-500 text-[9px] sm:text-xs font-bold max-w-[160px] text-center speech-bubble pink-shadow bubble-tail pointer-events-none" style="margin-top: -20px;"></div>
    <div id="bubble-bot" class="hidden absolute z-30 bg-black text-pink-400 p-2 rounded-md border-2 border-pink-500 text-[9px] sm:text-xs font-bold max-w-[150px] text-center speech-bubble pink-shadow bubble-tail pointer-events-none" style="margin-top: -20px;"></div>

    <div id="canvas-container"></div>
    <div id="vfx-layer" class="absolute inset-0 pointer-events-none z-40 overflow-hidden"></div>

    <script>
        const TABLE_W = 2.0; const TABLE_L = 3.0; const TABLE_H = 0.5;
        const GRAVITY = -10;
        const BALL_RAD = 0.04;
        const PLAYER_Z = TABLE_L / 2 + 0.5; // Сместили ракетку ниже к краю экрана
        const AI_Z = -TABLE_L / 2 - 0.2;

        let state = {
            status: 'idle', 
            ball: new THREE.Vector3(), vel: new THREE.Vector3(),
            targetX: 0, targetY: TABLE_H + 0.3,
            aiTargetX: 0, aiTargetY: TABLE_H + 0.3,
            pScore: 0, aScore: 0,
            server: 'player', matchServer: 'player',
            bounces: 0, lastHitSide: null, isServeHit: false, isSmash: false,
            isSmashReady: false,
            spin: 0, // Подкрутка (Эффект Магнуса)
            playerSwing: 0, // Анимация взмаха
            aiSwing: 0
        };

        const SPECTATOR_PHRASES = [
            "Эй, ЧМЗ! Подкрутку слабее делай, у меня аж пивасик прокис!",
            "Да у меня в гараже на двери от шкафа отскок ровнее был!",
            "Слыш, а после смены в мартеновском цеху по пивку в ларек?",
            "Мячик китайский, стол косой, судья на мыло!",
            "Ракетку держишь как лопату на субботнике!",
            "Давай топ-спин в левый угол, чего ты тупишь!",
            "Опять на заводе премию зажали, вот и играете вяло!",
            "ЧМЗ сила! Доменный цех на трибунах орет за тебя!",
            "Справа подрежь, слева ударь! Чему вас в секции учили?",
            "Эй, киборг, у нас на ЧМЗ на заводе и покруче роботы ломались!",
            "Судья куплен профсоюзом!",
            "Ты не ракеткой маши, ты ногами работай!",
            "Я в 80-х на области мастера спорта взял, а ты мажешь!"
        ];

        const BOT_TAUNTS = {
            serve: ["Принимай подачу, плавильный аппарат!", "Ща как вмажу по ГОСТу!", "Моя подача крепче уральской стали!", "Держи топ-спин от начальника цеха!"],
            rally: ["Слабый удар, как премия в декабре!", "Ты ракетку держишь или лом?!", "Киборги ЧМЗ не сдаются!", "Твой процессор перегрелся?", "У нас баба Зина в столовой сильнее бьет!"],
            win_point: ["Ха! Деталь в браке, очко мне!", "Система охлаждения тебя не спасла!", "Скрутил тебя как арматуру!", "Победа за Синдикатом!"],
            lose_point: ["Мои шарниры заржавели...", "Судья, он читерит с имплантами!", "Заводской брак в процессоре...", "Пинг скакнул, отвечаю!"]
        };

        const BOT_NAMES = ["НЕЙРО-ПЕТРОВИЧ", "КИБЕР-МИХАЛЫЧ", "РОБО-САНТЕХНИК", "СИНДИКАТ-МАСТЕР", "ЧМЗ-ТЕРМИНАТОР", "ЖЕЛЕЗНЫЙ ДИРЕКТОР"];

        const DIFF_LEVELS = [
            { id: 0, name: "НОВИЧОК", aiSpeed: 4, aiMiss: 0.35, ballTime: 0.8 },
            { id: 1, name: "ЛЮБИТЕЛЬ", aiSpeed: 8, aiMiss: 0.15, ballTime: 0.6 },
            { id: 2, name: "МАСТЕР", aiSpeed: 16, aiMiss: 0.05, ballTime: 0.45 }
        ];
        
        let currentDiff = DIFF_LEVELS[1];
        let audioCtx = null;
        let masterGainNode = null;
        let cameraShakeAmount = 0;
        let tableGroupRef = null;

        let rawPointerX = 0, rawPointerY = TABLE_H + 0.3;
        let lastTapTime = 0;
        let lastPointerX = 0; // Для расчета скорости свайпа

        const TRACK_NAMES = [
            "МАРТЕНОВСКАЯ ПЕЧЬ (SYNTH)",
            "НОЧНАЯ СМЕНА (TECHNO)",
            "СТАЛЬНОЙ ТОП-СПИН (8-BIT)",
            "ПРОФСОЮЗНЫЙ ФОНК",
            "ПЕРЕКУР МАСТЕРА (CHILL)"
        ];

        class ProceduralSegaEngine {
            constructor() {
                this.ctx = null; this.timer = null;
                this.nextNoteTime = 0; this.step = 0;
                this.trackIdx = 0; this.tempo = 130;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                    masterGainNode = this.ctx.createGain();
                    masterGainNode.gain.value = 0.15;
                    masterGainNode.connect(this.ctx.destination);
                }
                if (this.ctx.state === 'suspended') this.ctx.resume();
                if (!audioCtx) audioCtx = this.ctx;
            }
            setVolume(val) {
                if (masterGainNode) masterGainNode.gain.value = parseFloat(val);
            }
            play() {
                this.init();
                if(this.timer) cancelAnimationFrame(this.timer);
                if(this.trackIdx >= 5) return; 
                
                const tempos = [130, 115, 160, 95, 85];
                this.tempo = tempos[this.trackIdx]; 
                this.nextNoteTime = this.ctx.currentTime + 0.1;
                this.step = 0;
                this.scheduler();
            }
            stop() {
                if(this.timer) cancelAnimationFrame(this.timer);
            }
            nextTrack() {
                this.trackIdx = (this.trackIdx + 1) % 6;
                this.stop();
                if (this.trackIdx < 5) {
                    this.play();
                    return TRACK_NAMES[this.trackIdx];
                }
                return "МУЗЫКА: ВЫКЛ";
            }
            midi2Freq(m) { return 440 * Math.pow(2, (m - 69) / 12); }
            
            scheduleNote(step, time) {
                let style = this.trackIdx;
                
                // УДАРНИКИ (Кик и Снейр)
                if (style === 0 && step % 4 === 0) this.playKick(time); // Прямая бочка Synthwave
                if (style === 1 && (step % 8 === 0 || step % 8 === 3)) this.playKick(time); // Ломаное техно
                if (style === 2 && step % 2 === 0) { if(step%4===0) this.playKick(time); else this.playSnare(time); } // Панк
                if (style === 3 && step % 16 === 0) this.playKick(time, 0.4); // Жирный кик фонка
                if (style === 3 && step % 2 === 0) this.playHat(time); // Трэп хэты
                if (style === 4 && step % 8 === 0) this.playKick(time, 0.1); // Мягкий чилл кик

                // БАС
                const bases = [33, 36, 40, 28, 45];
                let baseMidi = bases[style];
                if (style === 0 && step % 2 === 0) this.playSynth(baseMidi + (step%8===0?0:12), time, 0.15, 'sawtooth', 0.15); // Бегающий арп
                if (style === 1 && step % 4 !== 0 && step % 2 === 0) this.playSynth(baseMidi + (step%3), time, 0.2, 'square', 0.1); // Офф-бит техно бас
                if (style === 2 && step % 2 === 0) this.playSynth(baseMidi + Math.floor(step/8)%4, time, 0.15, 'square', 0.1); // Ровный 8-бит бас
                if (style === 3 && step % 16 === 0) this.playSynth(baseMidi, time, 1.0, 'sine', 0.3); // Длинный 808 бас
                if (style === 4 && step % 8 === 0) this.playSynth(baseMidi - 12 + (step%16===0?0:5), time, 0.5, 'triangle', 0.2); // Мягкий гул

                // МЕЛОДИЯ
                if (Math.random() > 0.6) {
                    let offset = [0, 3, 7, 10, 12][Math.floor(Math.random() * 5)];
                    if (style === 0 && step % 2 !== 0) this.playSynth(baseMidi + 24 + offset, time, 0.1, 'square', 0.05);
                    if (style === 1 && step % 8 === 6) this.playSynth(baseMidi + 36, time, 0.2, 'sawtooth', 0.1);
                    if (style === 2 && step % 4 === 0) this.playSynth(baseMidi + 24 + offset, time, 0.1, 'square', 0.1);
                    if (style === 4 && step % 4 === 0) this.playSynth(baseMidi + 24 + offset, time, 0.4, 'sine', 0.1); // Мягкие колокольчики
                }
            }

            playKick(time, sustain=0.1) {
                let osc = this.ctx.createOscillator(); let gain = this.ctx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(120, time); osc.frequency.exponentialRampToValueAtTime(0.01, time + sustain);
                gain.gain.setValueAtTime(0.3, time); gain.gain.exponentialRampToValueAtTime(0.01, time + sustain);
                osc.connect(gain); gain.connect(masterGainNode); osc.start(time); osc.stop(time + sustain);
            }
            playSnare(time) {
                let osc = this.ctx.createOscillator(); let gain = this.ctx.createGain();
                osc.type = 'square'; osc.frequency.setValueAtTime(200, time);
                gain.gain.setValueAtTime(0.2, time); gain.gain.exponentialRampToValueAtTime(0.01, time + 0.1);
                osc.connect(gain); gain.connect(masterGainNode); osc.start(time); osc.stop(time + 0.1);
            }
            playHat(time) {
                let osc = this.ctx.createOscillator(); let gain = this.ctx.createGain();
                osc.type = 'square'; osc.frequency.setValueAtTime(800, time);
                gain.gain.setValueAtTime(0.05, time); gain.gain.exponentialRampToValueAtTime(0.01, time + 0.05);
                osc.connect(gain); gain.connect(masterGainNode); osc.start(time); osc.stop(time + 0.05);
            }
            playSynth(midi, time, duration, type, vol) {
                let osc = this.ctx.createOscillator(); let gain = this.ctx.createGain();
                osc.type = type; osc.frequency.value = this.midi2Freq(midi);
                gain.gain.setValueAtTime(vol, time); gain.gain.exponentialRampToValueAtTime(0.01, time + duration);
                let filter = this.ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 2500;
                osc.connect(filter); filter.connect(gain); gain.connect(masterGainNode);
                osc.start(time); osc.stop(time + duration);
            }

            scheduler = () => {
                while (this.nextNoteTime < this.ctx.currentTime + 0.1) {
                    this.scheduleNote(this.step, this.nextNoteTime);
                    this.nextNoteTime += (60.0 / this.tempo) / 4; 
                    this.step++;
                }
                this.timer = requestAnimationFrame(this.scheduler);
            }
        }
        
        const musicEngine = new ProceduralSegaEngine();

        function playSound(type) {
            if (!audioCtx) return;
            const t = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            if (type === 'hit') {
                osc.type = 'square'; osc.frequency.setValueAtTime(700, t); osc.frequency.exponentialRampToValueAtTime(100, t + 0.1);
                gain.gain.setValueAtTime(0.15, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
                osc.start(t); osc.stop(t + 0.1);
            } else if (type === 'bounce') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(300, t); osc.frequency.exponentialRampToValueAtTime(50, t + 0.15);
                gain.gain.setValueAtTime(0.2, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
                osc.start(t); osc.stop(t + 0.15);
            } else if (type === 'score') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(400, t); osc.frequency.exponentialRampToValueAtTime(800, t + 0.3);
                gain.gain.setValueAtTime(0.15, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
                osc.start(t); osc.stop(t + 0.3);
            } else if (type === 'fail') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, t); osc.frequency.exponentialRampToValueAtTime(50, t + 0.5);
                gain.gain.setValueAtTime(0.15, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.5);
                osc.start(t); osc.stop(t + 0.5);
            }
            
            // Безопасное подключение к AudioContext
            const dest = masterGainNode && masterGainNode.context === audioCtx ? masterGainNode : audioCtx.destination;
            osc.connect(gain); gain.connect(dest);
        }

        function vibrate(ms) { if (navigator.vibrate) try { navigator.vibrate(ms); } catch(e){} }

        const elLoading = document.getElementById('loading-screen');
        const elMenu = document.getElementById('main-menu');
        const elGameUI = document.getElementById('game-ui');
        const elGameOver = document.getElementById('game-over');
        const sysMsg = document.getElementById('system-msg');
        const serveMsg = document.getElementById('serve-msg');

        // Функция создания ракетки (Pivot находится в ручке для правильной анимации взмаха)
        function createRealisticRacket(isPlayer) {
            const group = new THREE.Group(); // Контейнер для перемещения (x,y)
            const pivot = new THREE.Group(); // Контейнер для поворота/взмаха
            
            const matRed = new THREE.MeshStandardMaterial({ color: 0xff0033, roughness: 0.7 });
            const matBlack = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.7 });
            const matEdge = new THREE.MeshStandardMaterial({ color: isPlayer ? 0x00ffff : 0xff00ff, emissive: isPlayer ? 0x00ffff : 0xff00ff, emissiveIntensity: 0.5 });
            
            const headGeo = new THREE.CylinderGeometry(0.18, 0.18, 0.02, 32); headGeo.rotateX(Math.PI / 2); 
            const head = new THREE.Mesh(headGeo, [matEdge, matRed, matBlack]);

            const handleGeo = new THREE.BoxGeometry(0.04, 0.15, 0.03);
            const handleMat = new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.9 });
            const handle = new THREE.Mesh(handleGeo, handleMat);
            handle.position.y = 0.075; 
            handle.castShadow = true;
            
            pivot.add(head); pivot.add(handle); 
            // Смещаем пивот так, чтобы вращение шло от ручки
            pivot.position.y = -0.15;
            
            // Вспомогательная обертка чтобы компенсировать смещение пивота
            const wrapper = new THREE.Group();
            wrapper.add(pivot);
            wrapper.position.y = 0.15;
            
            group.add(wrapper);
            return { group, pivot };
        }

        function createSparks(x, y, z, colorHex) {
            const mat = new THREE.MeshBasicMaterial({ color: colorHex });
            for (let i = 0; i < 8; i++) {
                const mesh = new THREE.Mesh(particleGeo, mat);
                mesh.position.set(x, y, z);

                scene.add(mesh);
                particles.push({ mesh, vx, vy, vz, life: 1.0 });
            }
        }

        function updateParticles(dt) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.vy += GRAVITY * dt;
                p.mesh.position.x += p.vx * dt;
                p.mesh.position.y += p.vy * dt;
                p.mesh.position.z += p.vz * dt;
                p.life -= dt * 3;
                
                p.mesh.scale.setScalar(p.life);
                
                if (p.life <= 0 || p.mesh.position.y < -2) {
                    scene.remove(p.mesh);
                    particles.splice(i, 1);
                }
            }
        }

            state.status = 'playing';
            state.bounces = 0;
            state.lastHitSide = isPlayer ? 'player' : 'ai';
            state.isServeHit = isServe;
            state.isSmash = false;
            
            // Задаем редкую случайную погрешность для ИИ (в зависимости от уровня сложности)
            if (isPlayer) {
                // Используем aiMiss как вероятность ошибки (например, 0.15 = 15% шанс промазать)
                if (Math.random() < currentDiff.aiMiss) {
                    // Если выпала ошибка, задаем смещение больше хитбокса (0.35), чтобы бот точно промахнулся
                    state.aiErrorOffset = (Math.random() > 0.5 ? 1 : -1) * (0.45 + Math.random() * 0.2); 
                } else {
                    // В остальных случаях бот играет идеально точно
                    state.aiErrorOffset = 0;
                }
            } else {
                state.aiErrorOffset = 0;
            }

            let sign = isPlayer ? -1 : 1;
            playSound('hit');
            
            // Запуск анимации взмаха
            if (isPlayer) state.playerSwing = 1.0;
            else state.aiSwing = 1.0;
            
            createSparks(state.ball.x, state.ball.y, state.ball.z, isPlayer ? 0x00ffff : 0xff00ff);

            if (isServe) {
                // Идеальная парабола подачи
                let time = 0.4; 
                let targetX = (Math.random() - 0.5) * TABLE_W * 0.4; 
                let targetZ = isPlayer ? (TABLE_L / 4) : -(TABLE_L / 4); 
                
                state.vel.x = (targetX - state.ball.x) / time;
                state.vel.z = (targetZ - state.ball.z) / time;
                state.vel.y = (TABLE_H - state.ball.y - 0.5 * GRAVITY * time * time) / time;
                
                if (!isPlayer) {
                    // Жестко задаем глубокую подачу для бота, чтобы мяч всегда долетал до игрока без "дабл-баунса"
                    state.vel.z = 5.5; 
                    state.vel.y = -2.0; 
                }
                
                state.spin = 0;
                
                trailMat.color.setHex(isPlayer ? 0x00ffff : 0xff00ff);
                ballMat.color.setHex(isPlayer ? 0x00ffff : 0xff00ff);
                ballMat.emissive.setHex(isPlayer ? 0x004444 : 0x440044);
            } else {
                let time = currentDiff.ballTime;
                let targetZ = sign * (TABLE_L / 4 + Math.random() * (TABLE_L/4));
                let targetX = (Math.random() - 0.5) * (TABLE_W * 0.85);
                let targetY = TABLE_H; 
                let ay = GRAVITY;

                if (isPlayer && state.isSmashReady) {
                    time = 0.25; state.isSmash = true; ay = -4; // Смэш летит прямо
                    state.isSmashReady = false;
                } else if (!isPlayer && currentDiff.id === 2 && Math.random() > 0.8) {
                    time = 0.3; state.isSmash = true; ay = -6;
                }
                
                // Расчет подкрутки (Эффект Магнуса) от движения пальца
                if (isPlayer) {
                    let swipeSpeed = rawPointerX - lastPointerX;
                    state.spin = swipeSpeed * 5; 
                    // Компенсируем цель, так как подкрутка унесет мяч в сторону
                    targetX -= state.spin * time;
                } else {
                    state.spin = (Math.random() - 0.5) * 2;
                }

                state.vel.x = (targetX - state.ball.x) / time;
                state.vel.z = (targetZ - state.ball.z) / time;
                state.vel.y = (targetY - state.ball.y - 0.5 * ay * time * time) / time;

                if (state.isSmash) {
                    vibrate(50);
                    trailMat.color.setHex(0xff0000); ballMat.color.setHex(0xff0000);
                    ballMat.emissive.setHex(0x440000);
                    spawnTextVFX("OVERCLOCK!", "#f00", true);
                } else {
                    trailMat.color.setHex(isPlayer ? 0x00ffff : 0xff00ff); ballMat.color.setHex(isPlayer ? 0x00ffff : 0xff00ff);
                    ballMat.emissive.setHex(isPlayer ? 0x004444 : 0x440044);
                }
            }
        }

        const clock = new THREE.Clock();
        
        function update(dt) {
            // Динамика окружения
            const t = clock.getElapsedTime();
            
            if (cameraShakeAmount > 0) {
                camera.position.x = (Math.random() - 0.5) * cameraShakeAmount;
                camera.position.y = 3 + (Math.random() - 0.5) * cameraShakeAmount;
                cameraShakeAmount -= dt * 1.5;
                if (cameraShakeAmount < 0) cameraShakeAmount = 0;
            } else {
                // Плавное слежение камеры за мячом
                let targetCamX = state.ball.x * 0.15;
                camera.position.x = THREE.MathUtils.lerp(camera.position.x, targetCamX, dt * 2);
                camera.position.y = THREE.MathUtils.lerp(camera.position.y, 3, dt * 2);
            }

            spec1.group.position.y = (TABLE_H - 1.2) + Math.sin(t * 3) * 0.03;
            spec2.group.position.y = (TABLE_H - 1.2) + Math.cos(t * 3.5) * 0.03;
            updateSpectatorBubbles(dt);

            lampRig.rotation.z = Math.sin(t * 1.5) * 0.03;
            lampRig.rotation.x = Math.cos(t * 1.1) * 0.015;
            
            if (Math.random() > 0.96) {
                mainLight.intensity = 1.5 + Math.random() * 1.5;
                bulb.material.color.setHSL(0.5, 1, 0.4 + Math.random() * 0.3);
            } else {
                mainLight.intensity = THREE.MathUtils.lerp(mainLight.intensity, 2.5, 10 * dt);
                bulb.material.color.setHSL(0.5, 1, 0.9);
            }
            
            updateParticles(dt);

            // Движение и анимация Игрока
            state.targetX = THREE.MathUtils.lerp(state.targetX, rawPointerX, 15 * dt);
            state.targetY = THREE.MathUtils.lerp(state.targetY, rawPointerY, 15 * dt);
            
            paddlePlayer.position.x = state.targetX;
            paddlePlayer.position.y = state.targetY;
            
            let tiltZ = (paddlePlayer.position.x - rawPointerX) * 2; 
            let flipY = state.targetX > 0 ? -0.2 : 0.2; 
            
            paddlePlayerPivot.rotation.z = THREE.MathUtils.lerp(paddlePlayerPivot.rotation.z, tiltZ, 10 * dt);
            paddlePlayerPivot.rotation.y = THREE.MathUtils.lerp(paddlePlayerPivot.rotation.y, flipY, 10 * dt);
            
            let targetPX = (state.status === 'playing' && state.vel.z > 0) ? -0.3 : 0;
            if (state.playerSwing > 0) {
                targetPX -= 1.0; // Взмах вперед
                state.playerSwing -= dt * 6;
            }
            paddlePlayerPivot.rotation.x = THREE.MathUtils.lerp(paddlePlayerPivot.rotation.x, targetPX, 15 * dt);

            // Движение и анимация ИИ
            if (state.status === 'playing' && state.vel.z < 0) {
                // Применяем заранее вычисленную погрешность (aiErrorOffset), чтобы бот мог физически промахнуться
                state.aiTargetX = state.ball.x + (state.aiErrorOffset || 0);
                state.aiTargetY = Math.max(TABLE_H + 0.2, state.ball.y);
            } else {
                state.aiTargetX = THREE.MathUtils.lerp(state.aiTargetX, 0, 2 * dt); 
                state.aiTargetY = THREE.MathUtils.lerp(state.aiTargetY, TABLE_H + 0.3, 2 * dt);
            }
            
            currentOpponent.group.position.x = THREE.MathUtils.lerp(currentOpponent.group.position.x, state.aiTargetX * 0.5, currentDiff.aiSpeed * dt);
            currentOpponent.group.rotation.y = THREE.MathUtils.lerp(currentOpponent.group.rotation.y, (state.aiTargetX * 0.1), 10 * dt);

            paddleAi.position.x = THREE.MathUtils.lerp(paddleAi.position.x, state.aiTargetX, currentDiff.aiSpeed * dt);
            paddleAi.position.y = THREE.MathUtils.lerp(paddleAi.position.y, state.aiTargetY, currentDiff.aiSpeed * dt);
            
            paddleAiPivot.rotation.y = state.aiTargetX > 0 ? 0.2 : -0.2;
            let targetAX = (state.status === 'playing' && state.vel.z < 0) ? 0.3 : 0;
            if (state.aiSwing > 0) {
                targetAX += 1.0; // Взмах ИИ
                state.aiSwing -= dt * 6;
            }
            paddleAiPivot.rotation.x = THREE.MathUtils.lerp(paddleAiPivot.rotation.x, targetAX, 15 * dt);

            // Физика мяча
            if (state.status === 'playing' || state.status === 'serve_toss') {
                let ay = (state.status === 'playing' && state.isSmash && !state.isServeHit) ? -5 : GRAVITY;
                state.vel.y += ay * dt;
                
                // Применение эффекта Магнуса (Закрутка)
                if (state.status === 'playing') {
                    state.vel.x += state.spin * dt;
                }

                state.ball.addScaledVector(state.vel, dt);
                ball.position.copy(state.ball);

                // Отскок от стола
                if (state.ball.y - BALL_RAD < TABLE_H && state.vel.y < 0) {
                    if (Math.abs(state.ball.x) < TABLE_W/2 && Math.abs(state.ball.z) < TABLE_L/2) {
                        state.ball.y = TABLE_H + BALL_RAD;
                        state.vel.y = Math.abs(state.vel.y) * (state.isSmash ? 0.9 : 0.85); 
                        
                        playSound('bounce'); vibrate(15);
                        cameraShakeAmount = state.isSmash ? 0.1 : 0.05;
                        createSparks(state.ball.x, state.ball.y, state.ball.z, 0xffff00);
                        
                        state.bounces++;
                        let bounceSide = state.ball.z > 0 ? 'player' : 'ai';
                        
                        if (state.isServeHit) {
                            if (state.bounces === 1) {
                                if (bounceSide !== state.lastHitSide) scorePoint(bounceSide, "ОШИБКА ПОДАЧИ: НЕТ КАСАНИЯ СВОЕЙ ЗОНЫ");
                            } else if (state.bounces === 2) {
                                if (bounceSide === state.lastHitSide) scorePoint(bounceSide === 'player' ? 'ai' : 'player', "ДАБЛ-БАУНС НА СВОЕЙ ЗОНЕ");
                            } else if (state.bounces === 3) {
                                scorePoint(bounceSide === 'player' ? 'ai' : 'player', "ОЧКО!");
                            }
                        } else {
                            if (state.bounces === 1) {
                                if (bounceSide === state.lastHitSide) scorePoint(bounceSide === 'player' ? 'ai' : 'player', "ОШИБКА: ОТСКОК ОТ СВОЕЙ ЗОНЫ");
                            } else if (state.bounces === 2) {
                                scorePoint(bounceSide === 'player' ? 'ai' : 'player', "ДАБЛ-БАУНС!");
                            }
                        }
                    } else if (state.ball.y < TABLE_H - 0.2) {
                        if (state.bounces === 0) scorePoint(state.lastHitSide === 'player' ? 'ai' : 'player', "АУТ!"); 
                        else scorePoint(state.lastHitSide === 'player' ? 'player' : 'ai', "ОЧКО!"); 
                    }
                }

                // Сетка (упрощенная коллизия)
                if (Math.abs(state.ball.z) < 0.05 && state.ball.y < TABLE_H + 0.15 && state.status === 'playing') {
                    scorePoint(state.lastHitSide === 'player' ? 'ai' : 'player', "УДАР В СЕТКУ");
                    state.vel.x *= 0.2; state.vel.z *= -0.2;
                }

                // Строгий хитбокс: теперь нужно очень точно подводить ракетку по ширине к мячу!
                const HIT_RAD_X = 0.35; 
                
                // Игрок отбивает (расширили зону отбивания вперед Z - 0.8, чтобы ловить даже короткие мячи)
                if (state.vel.z > 0 && state.ball.z > PLAYER_Z - 0.8 && state.ball.z < PLAYER_Z + 0.5 && state.bounces > 0) {
                    let distX = Math.abs(state.ball.x - paddlePlayer.position.x);
                    if (distX < HIT_RAD_X) {
                        state.ball.z = PLAYER_Z - 0.4; 
                        // Мячик "сам долетает" — визуально притягиваем ракетку к высоте мяча в момент удара
                        paddlePlayer.position.y = state.ball.y; 
                        state.targetY = state.ball.y;
                        performHit(true);
                    }
                }

                // ИИ отбивает (Бот отбивает только если ракетка успела приблизиться с учетом погрешности)
                if (state.vel.z < 0 && state.ball.z < AI_Z + 0.4 && state.ball.z > AI_Z - 0.5 && state.bounces > 0) {
                    let distX = Math.abs(state.ball.x - paddleAi.position.x);
                    if (distX < HIT_RAD_X) {
                        state.ball.z = AI_Z + 0.4; 
                        paddleAi.position.y = state.ball.y;
                        performHit(false);
                    }
                }
                
                if (state.status === 'serve_toss') {
                    let pY = state.server === 'player' ? paddlePlayer.position.y : paddleAi.position.y;
                    if (state.vel.y < 0 && state.ball.y <= pY + 0.15) performHit(state.server === 'player', true);
                }

            } else if (state.status === 'serve_wait') {
                if (state.server === 'player') {
                    state.ball.copy(paddlePlayer.position).add(new THREE.Vector3(0, 0.1, -0.1));
                } else {
                    state.ball.copy(paddleAi.position).add(new THREE.Vector3(0, 0.1, 0.1));
                }
                ball.position.copy(state.ball);
            }

            // Шлейф (улучшенное обновление позиций)
            if (state.status === 'playing' || state.status === 'serve_toss') {
                for(let i = MAX_TRAIL - 1; i > 0; i--) {
                    trailPos[i*3] = trailPos[(i-1)*3]; trailPos[i*3+1] = trailPos[(i-1)*3+1]; trailPos[i*3+2] = trailPos[(i-1)*3+2];
                }
                trailPos[0] = ball.position.x; trailPos[1] = ball.position.y; trailPos[2] = ball.position.z;
                trailGeo.attributes.position.needsUpdate = true;
            } else {
                trailPos.fill(0); trailGeo.attributes.position.needsUpdate = true;
            }

            renderer.render(scene, camera);
        }

        function animate() { requestAnimationFrame(animate); update(Math.min(clock.getDelta(), 0.05)); }
        
        function handleResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            if (camera.aspect < 1) camera.position.set(0, 4.5, 7.5); 
            else camera.position.set(0, 3, 5); 
            camera.updateProjectionMatrix(); 
            renderer.setSize(window.innerWidth, window.innerHeight); 
        }
        
        window.addEventListener('resize', handleResize);
        handleResize(); 
        animate();
    </script>
</body>
</html>
