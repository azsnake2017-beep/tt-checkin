<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CYBER PONG: ЧМЗ СИНДИКАТ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background-color: #050505; color: #0ff;
            font-family: 'Press Start 2P', monospace;
        }

        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
        }

        .glitch-text { text-shadow: 2px 0 #f0f, -2px 0 #0ff; }

        .neon-border {
            border: 2px solid #0ff; box-shadow: 0 0 10px #0ff, inset 0 0 10px #0ff;
            background: rgba(0, 20, 20, 0.8);
        }
        
        .neon-border-pink {
            border: 2px solid #f0f; box-shadow: 0 0 10px #f0f, inset 0 0 10px #f0f;
            background: rgba(20, 0, 20, 0.8);
        }

        .neon-btn {
            background: transparent; border: 2px solid #0ff; color: #0ff;
            text-transform: uppercase; cursor: pointer; transition: 0.2s;
            box-shadow: 0 0 5px #0ff;
        }
        .neon-btn:active, .neon-btn.active { background: #0ff; color: #000; box-shadow: 0 0 20px #0ff; }

        .neon-btn-pink { border-color: #f0f; color: #f0f; box-shadow: 0 0 5px #f0f; }
        .neon-btn-pink:active { background: #f0f; color: #000; box-shadow: 0 0 20px #f0f; }

        #loading-screen, #main-menu, #game-ui, #game-over { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; }
        #canvas-container { position: absolute; inset: 0; z-index: 1; }
        
        .hidden { display: none !important; }

        .vfx-text {
            position: absolute; font-size: 1.5rem; pointer-events: none; z-index: 50;
            animation: floatUp 0.8s ease-out forwards;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 1; }
            100% { transform: translateY(-50px) scale(1.2); opacity: 0; }
        }
        
        .shake { animation: shake-anim 0.2s ease-in-out; }
        @keyframes shake-anim {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(-6px, 6px); }
            50% { transform: translate(6px, -6px); }
            75% { transform: translate(-6px, -6px); }
        }

        .speech-bubble {
            transition: top 0.1s, left 0.1s;
            animation: pop-bubble 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            box-shadow: 4px 4px 0px rgba(0, 255, 255, 0.5);
        }
        .speech-bubble.pink-shadow { box-shadow: 4px 4px 0px rgba(255, 0, 255, 0.5); }
        @keyframes pop-bubble {
            0% { transform: translate(-50%, -100%) scale(0); opacity: 0; }
            100% { transform: translate(-50%, -100%) scale(1); opacity: 1; }
        }
        .bubble-tail::after {
            content: ''; position: absolute; bottom: -8px; 
            left: calc(50% + var(--tail-shift, 0px));
            margin-left: -8px; border-width: 8px 8px 0;
            border-style: solid; border-color: #fff transparent transparent transparent;
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>

    <!-- 1. ЭКРАН ЗАГРУЗКИ -->
    <div id="loading-screen" class="justify-center items-center bg-black">
        <h1 class="text-2xl sm:text-4xl glitch-text mb-8 text-center leading-loose">СИНДИКАТ<br>ЧМЗ</h1>
        <div class="w-64 border-2 border-cyan-400 p-1">
            <div id="loading-bar" class="h-4 bg-cyan-400 w-0 transition-all duration-100"></div>
        </div>
        <p id="loading-text" class="mt-4 text-xs text-cyan-400 animate-pulse">Инициализация физического ядра...</p>
    </div>

    <!-- 2. ГЛАВНОЕ МЕНЮ -->
    <div id="main-menu" class="hidden justify-center items-center bg-black/90 backdrop-blur-sm p-4">
        <h1 class="text-3xl sm:text-5xl glitch-text mb-2 text-center">CYBER PONG</h1>
        <h2 class="text-xs sm:text-sm text-pink-500 mb-12 text-center">WTT PROTOCOL v3.3</h2>
        
        <div class="w-full max-w-md neon-border p-6 flex flex-col gap-6">
            <h3 class="text-center text-sm text-yellow-400">ВЫБЕРИТЕ УРОВЕНЬ ДОСТУПА:</h3>
            
            <button class="diff-btn neon-btn py-4 text-xs sm:text-sm" data-diff="0">НОВИЧОК (Легко)</button>
            <button class="diff-btn neon-btn py-4 text-xs sm:text-sm active bg-cyan-400 text-black" data-diff="1">ЛЮБИТЕЛЬ (Норма)</button>
            <button class="diff-btn neon-btn py-4 text-xs sm:text-sm" data-diff="2">МАСТЕР (Хардкор)</button>
            
            <button id="start-btn" class="neon-btn-pink py-4 text-sm mt-4">ПОДКЛЮЧИТЬСЯ</button>
        </div>
    </div>

    <!-- 3. ИГРОВОЙ UI -->
    <div id="game-ui" class="hidden pointer-events-none p-2 sm:p-4 justify-between">
        <div class="flex justify-between items-start w-full gap-2">
            <!-- Игрок -->
            <div class="neon-border p-2 sm:p-4 flex flex-col items-center flex-1 max-w-[120px] bg-black/80">
                <span class="text-[10px] sm:text-xs text-cyan-400 mb-2">ПОЛЬЗОВАТЕЛЬ</span>
                <span id="score-player" class="text-2xl sm:text-4xl text-white glitch-text">0</span>
            </div>
            
            <!-- Инфо-баннер -->
            <div class="neon-border p-2 flex-1 text-center bg-black/80 flex flex-col justify-center min-h-[60px]">
                <span id="system-msg" class="text-[8px] sm:text-[10px] text-yellow-400 leading-relaxed">ОЖИДАНИЕ СИНХРОНИЗАЦИИ...</span>
            </div>

            <!-- Бот -->
            <div class="neon-border-pink p-2 sm:p-4 flex flex-col items-center flex-1 max-w-[120px] bg-black/80">
                <span id="bot-name" class="text-[10px] sm:text-xs text-pink-500 mb-2 text-center">БОТ-Н3ЙРО</span>
                <span id="score-ai" class="text-2xl sm:text-4xl text-white glitch-text">0</span>
            </div>
        </div>

        <div class="w-full text-center mb-8 pointer-events-none">
            <span id="serve-msg" class="text-[10px] sm:text-xs text-cyan-400 bg-black/80 p-2 border border-cyan-400 animate-pulse hidden">ТАПНИ ДЛЯ ПОДБРОСА МЯЧА</span>
        </div>
        
        <!-- Нижняя панель с кнопками для мобилок -->
        <div class="absolute bottom-4 left-2 right-2 flex justify-between items-end pointer-events-auto z-40">
            <button id="menu-exit-btn" class="neon-btn-pink px-3 py-2 text-[10px] sm:text-xs">В МЕНЮ</button>
            <div class="flex flex-col items-end gap-1 bg-black/80 p-2 border border-cyan-400 rounded">
                <div class="flex items-center gap-2">
                    <span class="text-[8px] text-cyan-400">ГРОМКОСТЬ:</span>
                    <input id="volume-slider" type="range" min="0" max="1" step="0.05" value="0.2" class="w-20 accent-cyan-400">
                </div>
                <button id="music-btn" class="neon-btn px-3 py-2 text-[10px] sm:text-xs w-full">ТРЕК: 1</button>
            </div>
        </div>
    </div>

    <!-- 4. ЭКРАН КОНЦА МАТЧА -->
    <div id="game-over" class="hidden justify-center items-center bg-black/90 backdrop-blur-md z-50 p-4">
        <div class="neon-border p-8 flex flex-col items-center text-center w-full max-w-md">
            <h2 id="result-title" class="text-3xl sm:text-4xl glitch-text mb-4">СИСТЕМА ВЗЛОМАНА</h2>
            <p id="result-desc" class="text-xs sm:text-sm text-yellow-400 mb-8 leading-loose">Матч завершен.</p>
            <button id="restart-btn" class="neon-btn py-4 px-8 text-sm w-full pointer-events-auto">ПЕРЕЗАГРУЗИТЬ СЕССИЮ</button>
            <button id="menu-btn" class="neon-btn-pink py-4 px-8 text-sm w-full mt-4 pointer-events-auto">В ГЛАВНОЕ МЕНЮ</button>
        </div>
    </div>

    <!-- Облачка со шутками забулдыг и соперника -->
    <div id="bubble-1" class="hidden absolute z-30 bg-white text-black p-2 rounded-md border-2 border-cyan-400 text-[9px] sm:text-xs font-bold max-w-[160px] text-center speech-bubble bubble-tail pointer-events-none" style="margin-top: -20px;"></div>
    <div id="bubble-2" class="hidden absolute z-30 bg-white text-black p-2 rounded-md border-2 border-pink-500 text-[9px] sm:text-xs font-bold max-w-[160px] text-center speech-bubble pink-shadow bubble-tail pointer-events-none" style="margin-top: -20px;"></div>
    <div id="bubble-bot" class="hidden absolute z-30 bg-black text-pink-400 p-2 rounded-md border-2 border-pink-500 text-[9px] sm:text-xs font-bold max-w-[150px] text-center speech-bubble pink-shadow bubble-tail pointer-events-none" style="margin-top: -20px;"></div>

    <div id="canvas-container"></div>
    <div id="vfx-layer" class="absolute inset-0 pointer-events-none z-40 overflow-hidden"></div>

    <script>
        const TABLE_W = 2.0; const TABLE_L = 3.0; const TABLE_H = 0.5;
        const GRAVITY = -10;
        const BALL_RAD = 0.04;
        const PLAYER_Z = TABLE_L / 2 + 0.2;
        const AI_Z = -TABLE_L / 2 - 0.2;

        let state = {
            status: 'idle', 
            ball: new THREE.Vector3(), vel: new THREE.Vector3(),
            targetX: 0, targetY: TABLE_H + 0.3,
            aiTargetX: 0, aiTargetY: TABLE_H + 0.3,
            pScore: 0, aScore: 0,
            server: 'player', matchServer: 'player',
            bounces: 0, lastHitSide: null, isServeHit: false, isSmash: false,
            isSmashReady: false
        };

        const SPECTATOR_PHRASES = [
            "Эй, ЧМЗ! Подкрутку слабее делай, у меня аж пивасик прокис!",
            "Да у меня в гараже на двери от шкафа отскок ровнее был!",
            "Слыш, а после смены в мартеновском цеху по пивку в ларек?",
            "Мячик китайский, стол косой, судья на мыло!",
            "Ракетку держишь как лопату на субботнике!",
            "Давай топ-спин в левый угол, чего ты тупишь!",
            "Опять на заводе премию зажали, вот и играете вяло!",
            "ЧМЗ сила! Доменный цех на трибунах орет за тебя!",
            "Справа подрежь, слева ударь! Чему вас в секции учили?",
            "Да мой кот на клавиатуре лучше играет!",
            "Эй, киборг, не качай права, у нас на ЧМЗ на заводе и покруче роботы ломались!",
            "Судья куплен профсоюзом!",
            "Мяч летит медленнее, чем зарплата на карточку!"
        ];

        const BOT_TAUNTS = {
            serve: ["Принимай подачу с ЧМЗ!", "Сейчас будет кибер-крученый топ-спин!", "Посмотрим, как твой процессор это отобьет."],
            rally: ["Слабый сетевой пакет!", "Твоя реакция ниже пинга 10ms!", "Мячик идет на сверхзвуке!", "Не успеешь за моим процессором!"],
            win_point: ["Ха! Мой ИИ просчитал каждый твой шаг!", "Системная победа за мной!", "Твой файрвол пробит!"],
            lose_point: ["Критическая ошибка... Как ты это отбил?", "Невозможно! Твой софт читерит!", "Мои алгоритмы дали сбой..."]
        };

        const BOT_NAMES = ["НЕЙРО-ПАНК", "КИБЕР-СЭМ", "ГЛИТЧ-МАСТЕР", "СИНДИКАТ-ХАКЕР", "ХРОМ-БОТ", "ЧМЗ-КИБОРГ"];

        const DIFF_LEVELS = [
            { id: 0, name: "НОВИЧОК", aiSpeed: 4, aiMiss: 0.35, ballTime: 0.8 },
            { id: 1, name: "ЛЮБИТЕЛЬ", aiSpeed: 8, aiMiss: 0.15, ballTime: 0.6 },
            { id: 2, name: "МАСТЕР", aiSpeed: 16, aiMiss: 0.05, ballTime: 0.45 }
        ];
        
        let currentDiff = DIFF_LEVELS[1];
        let audioCtx = null;
        let masterGainNode = null;
        let cameraShakeAmount = 0;
        let tableGroupRef = null;

        let rawPointerX = 0, rawPointerY = TABLE_H + 0.3;
        let lastTapTime = 0;

        class MysteriousFunMusicEngine {
            constructor() {
                this.ctx = null; this.timer = null;
                this.nextNoteTime = 0; this.step = 0;
                this.trackIdx = 0; this.tempo = 115;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                    masterGainNode = this.ctx.createGain();
                    masterGainNode.gain.value = 0.2;
                    masterGainNode.connect(this.ctx.destination);
                }
                if (this.ctx.state === 'suspended') this.ctx.resume();
                if (!audioCtx) audioCtx = this.ctx;
            }
            setVolume(val) {
                if (masterGainNode) masterGainNode.gain.value = parseFloat(val);
            }
            play() {
                this.init();
                if(this.timer) cancelAnimationFrame(this.timer);
                if(this.trackIdx >= 5) return; 
                
                const tempos = [110, 120, 112, 125, 115];
                this.tempo = tempos[this.trackIdx];
                this.nextNoteTime = this.ctx.currentTime + 0.1;
                this.step = 0;
                this.scheduler();
            }
            stop() {
                if(this.timer) cancelAnimationFrame(this.timer);
            }
            nextTrack() {
                this.trackIdx = (this.trackIdx + 1) % 6;
                this.stop();
                if (this.trackIdx < 5) {
                    this.play();
                    return "ТРЕК: " + (this.trackIdx + 1) + "/5";
                }
                return "МУЗЫКА: ВЫКЛ";
            }
            midi2Freq(m) { return 440 * Math.pow(2, (m - 69) / 12); }
            
            scheduleNote(step, time) {
                const trackData = [
                    { scale: [57, 60, 63, 65, 68, 72], melody: [72, 75, 77, 72, 68, 70, 72, 75] },
                    { scale: [55, 58, 62, 65, 67, 70], melody: [70, 67, 65, 62, 67, 70, 74, 70] },
                    { scale: [60, 63, 67, 70, 72, 75], melody: [75, 72, 70, 67, 72, 75, 79, 75] },
                    { scale: [53, 56, 60, 63, 65, 68], melody: [68, 65, 63, 60, 65, 68, 72, 68] },
                    { scale: [58, 61, 65, 68, 70, 73], melody: [73, 70, 68, 65, 70, 73, 77, 73] }
                ];

                const tConf = trackData[this.trackIdx % trackData.length];
                const baseNote = tConf.scale[Math.floor(step / 4) % tConf.scale.length];
                const melNote = tConf.melody[step % tConf.melody.length];

                if (step % 2 === 0) {
                    let osc = this.ctx.createOscillator(); let gain = this.ctx.createGain();
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(this.midi2Freq(baseNote - 24), time);
                    gain.gain.setValueAtTime(0.12, time); gain.gain.exponentialRampToValueAtTime(0.01, time + 0.2);
                    osc.connect(gain); gain.connect(masterGainNode);
                    osc.start(time); osc.stop(time + 0.2);
                }

                let oscM = this.ctx.createOscillator(); let gainM = this.ctx.createGain();
                oscM.type = 'sine'; oscM.frequency.value = this.midi2Freq(melNote);
                gainM.gain.setValueAtTime(0.08, time); gainM.gain.exponentialRampToValueAtTime(0.01, time + 0.18);
                oscM.connect(gainM); gainM.connect(masterGainNode);
                oscM.start(time); oscM.stop(time + 0.18);
            }
            scheduler = () => {
                while (this.nextNoteTime < this.ctx.currentTime + 0.1) {
                    this.scheduleNote(this.step, this.nextNoteTime);
                    this.nextNoteTime += (60.0 / this.tempo) / 2;
                    this.step++;
                }
                this.timer = requestAnimationFrame(this.scheduler);
            }
        }
        
        const musicEngine = new MysteriousFunMusicEngine();

        function playSound(type) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const t = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            if (type === 'hit') {
                osc.type = 'square'; osc.frequency.setValueAtTime(600, t); osc.frequency.exponentialRampToValueAtTime(100, t + 0.1);
                gain.gain.setValueAtTime(0.15, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
                osc.start(t); osc.stop(t + 0.1);
            } else if (type === 'bounce') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(300, t); osc.frequency.exponentialRampToValueAtTime(50, t + 0.15);
                gain.gain.setValueAtTime(0.2, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
                osc.start(t); osc.stop(t + 0.15);
            } else if (type === 'score') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(400, t); osc.frequency.exponentialRampToValueAtTime(800, t + 0.3);
                gain.gain.setValueAtTime(0.15, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
                osc.start(t); osc.stop(t + 0.3);
            } else if (type === 'fail') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, t); osc.frequency.exponentialRampToValueAtTime(50, t + 0.5);
                gain.gain.setValueAtTime(0.15, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.5);
                osc.start(t); osc.stop(t + 0.5);
            }
            
            if (masterGainNode && masterGainNode.context === audioCtx) {
                osc.connect(gain); gain.connect(masterGainNode);
            } else {
                osc.connect(gain); gain.connect(audioCtx.destination);
            }
        }

        function vibrate(ms) { if (navigator.vibrate) try { navigator.vibrate(ms); } catch(e){} }

        const elLoading = document.getElementById('loading-screen');
        const elMenu = document.getElementById('main-menu');
        const elGameUI = document.getElementById('game-ui');
        const elGameOver = document.getElementById('game-over');
        const sysMsg = document.getElementById('system-msg');
        const serveMsg = document.getElementById('serve-msg');
        
        function printMsg(text, isError = false) {
            sysMsg.textContent = text;
            sysMsg.className = `text-[8px] sm:text-[10px] leading-relaxed ${isError ? 'text-pink-500' : 'text-cyan-400'}`;
        }

        function spawnTextVFX(text, color, isSmash = false) {
            const vfx = document.createElement('div');
            vfx.className = 'vfx-text font-bold';
            vfx.style.color = color;
            vfx.style.left = Math.random() * 40 + 30 + '%';
            vfx.style.top = Math.random() * 40 + 30 + '%';
            vfx.style.textShadow = `0 0 10px ${color}`;
            vfx.textContent = text;
            if(isSmash) vfx.style.transform = 'scale(1.5)';
            document.getElementById('vfx-layer').appendChild(vfx);
            setTimeout(() => vfx.remove(), 800);
            
            cameraShakeAmount = isSmash ? 0.35 : 0.12;
            document.body.classList.remove('shake');
            void document.body.offsetWidth;
            document.body.classList.add('shake');
        }

        let loadProg = 0;
        const loadInt = setInterval(() => {
            loadProg += Math.random() * 20;
            if (loadProg >= 100) {
                loadProg = 100;
                clearInterval(loadInt);
                setTimeout(() => {
                    elLoading.classList.add('hidden');
                    elMenu.classList.remove('hidden');
                }, 500);
            }
            document.getElementById('loading-bar').style.width = loadProg + '%';
        }, 150);

        document.querySelectorAll('.diff-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.diff-btn').forEach(b => { b.classList.remove('active', 'bg-cyan-400', 'text-black'); });
                e.target.classList.add('active', 'bg-cyan-400', 'text-black');
                currentDiff = DIFF_LEVELS[parseInt(e.target.dataset.diff)];
            });
        });

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);
        document.getElementById('menu-btn').addEventListener('click', goMainMenu);
        document.getElementById('menu-exit-btn').addEventListener('click', goMainMenu);
        
        document.getElementById('music-btn').addEventListener('click', (e) => {
            e.target.textContent = musicEngine.nextTrack();
        });

        document.getElementById('volume-slider').addEventListener('input', (e) => {
            musicEngine.setVolume(e.target.value);
        });

        function goMainMenu() {
            elGameOver.classList.add('hidden');
            elGameUI.classList.add('hidden');
            elMenu.classList.remove('hidden');
            musicEngine.stop();
        }

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.03);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 3, 5);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Индустриальная лампа над столом
        const lampRig = new THREE.Group();
        lampRig.position.set(0, 4.0, 0);

        const wire = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, 1.5), new THREE.MeshBasicMaterial({color: 0x333333}));
        wire.position.y = -0.75;
        
        const lampShade = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.5, 0.3, 8, 1, true), new THREE.MeshStandardMaterial({color: 0x111111, side: THREE.DoubleSide}));
        lampShade.position.y = -1.5;

        function triggerBotTaunt(type = 'rally') {
            const list = BOT_TAUNTS[type] || BOT_TAUNTS.rally;
            const text = list[Math.floor(Math.random() * list.length)];
            elBubbleBot.textContent = text;

        function updateSpectatorBubbles(dt) {
            specTimer -= dt;
            if (specTimer <= 0) {
                if (Math.random() > 0.2) {
                    activeBubble = Math.random() > 0.5 ? 1 : 2;
                    const text = SPECTATOR_PHRASES[Math.floor(Math.random() * SPECTATOR_PHRASES.length)];
                    if (activeBubble === 1) {
                        elBubble1.textContent = text; elBubble1.classList.remove('hidden'); elBubble2.classList.add('hidden');
                    } else {
                        elBubble2.textContent = text; elBubble2.classList.remove('hidden'); elBubble1.classList.add('hidden');
                    }
                    specTimer = 3 + Math.random() * 3;
                } else {
                    activeBubble = null;
                    elBubble1.classList.add('hidden'); elBubble2.classList.add('hidden');
                    specTimer = 2 + Math.random() * 2;
                }
            }

            botBubbleTimer -= dt;
            if (botBubbleTimer <= 0 && state.status === 'playing') {
                triggerBotTaunt('rally');
                botBubbleTimer = 7 + Math.random() * 6;
            }

            if (activeBubble) {
                const targetSpec = activeBubble === 1 ? spec1 : spec2;
                const targetEl = activeBubble === 1 ? elBubble1 : elBubble2;
                const headPos = new THREE.Vector3();
                targetSpec.head.getWorldPosition(headPos);
                headPos.y += 0.3; headPos.project(camera);

                const targetX = (headPos.x * .5 + .5) * window.innerWidth;
                const targetY = (headPos.y * -.5 + .5) * window.innerHeight;

                const padding = 10; const bubbleWidth = targetEl.offsetWidth || 160;
                const minX = bubbleWidth / 2 + padding; const maxX = window.innerWidth - bubbleWidth / 2 - padding;
                const clampedX = Math.max(minX, Math.min(maxX, targetX));
                
                let tailShift = targetX - clampedX;
                tailShift = Math.max(-60, Math.min(60, tailShift)); 

                targetEl.style.left = `${clampedX}px`;
                targetEl.style.top = `${targetY}px`;
                targetEl.style.setProperty('--tail-shift', `${tailShift}px`);
            }

            const botHeadPos = new THREE.Vector3();
            currentOpponent.head.getWorldPosition(botHeadPos);
            botHeadPos.y += 0.4; botHeadPos.project(camera);
            const bX = (botHeadPos.x * .5 + .5) * window.innerWidth;
            const bY = (botHeadPos.y * -.5 + .5) * window.innerHeight;
            elBubbleBot.style.left = `${Math.max(70, Math.min(window.innerWidth - 70, bX))}px`;
            elBubbleBot.style.top = `${bY}px`;
        }

        function updatePointer(cx, cy) {
            let nx = (cx / window.innerWidth) * 2 - 1;
            let ny = -(cy / window.innerHeight) * 2 + 1;
            rawPointerX = nx * (TABLE_W * 1.5);
            let yOffset = (window.innerWidth < 768) ? -0.15 : 0.0;
            rawPointerY = Math.max(TABLE_H - 0.1, Math.min(TABLE_H + 1.2, TABLE_H + 0.2 + yOffset + (ny + 1) * 0.6));
        }

        function handleTap() {
            if(!audioCtx) playSound('bounce');
            let now = Date.now();
            let isDouble = (now - lastTapTime < 300);
            lastTapTime = now;

            if (state.status === 'serve_wait' && state.server === 'player') {
                state.status = 'serve_toss';
                state.vel.set(0, 4.5, 0); 
                serveMsg.classList.add('hidden');
                printMsg("ПОДБРОС ВЫПОЛНЕН");
            } else if (state.status === 'playing' && isDouble) {
                state.isSmashReady = true;
            }
        }

        window.addEventListener('pointermove', (e) => updatePointer(e.clientX, e.clientY));
        window.addEventListener('pointerdown', (e) => { updatePointer(e.clientX, e.clientY); handleTap(); });
        window.addEventListener('touchmove', (e) => { e.preventDefault(); updatePointer(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});

        function startGame() {

            elGameUI.classList.remove('hidden'); elGameUI.style.display = 'flex';

            state.matchServer = 'player'; state.server = 'player';

            if(musicEngine.trackIdx < 1) {
                musicEngine.play();
            }
        }

        function updateScoreUI() {
            document.getElementById('score-player').textContent = state.pScore;
            document.getElementById('score-ai').textContent = state.aScore;
        }

        function resetBall() {
            state.status = 'serve_wait';
            state.vel.set(0,0,0);
            state.bounces = 0; state.lastHitSide = null; state.isServeHit = false;
            state.isSmashReady = false; state.isSmash = false;
            
            trailMat.color.setHex(0xffff00); ballMat.color.setHex(0xffff00);
            let txt = (state.pScore >= 10 && state.aScore >= 10) ? "БАЛАНС! ПОДАЧА " : "ПОДАЧА ";
            
            if (state.server === 'player') {
                serveMsg.classList.remove('hidden');
                printMsg(txt + "ПОЛЬЗОВАТЕЛЯ");
            } else {
                serveMsg.classList.add('hidden');
                printMsg(txt + "АЛГОРИТМА...");
                triggerBotTaunt('serve');
                setTimeout(() => {
                    if (state.status === 'serve_wait') {
                        state.status = 'serve_toss';
                        state.vel.set(0, 4.5, 0);
                    }
                }, 1000);
            }
        }

        function getNextServer() {
            const tot = state.pScore + state.aScore;
            if (state.pScore >= 10 && state.aScore >= 10) return state.server === 'player' ? 'ai' : 'player';
            return Math.floor(tot / 2) % 2 === 0 ? state.matchServer : (state.matchServer === 'player' ? 'ai' : 'player');
        }

        function scorePoint(winner, reason = "") {
            if (state.status === 'scored') return;
            state.status = 'scored';
            playSound(winner === 'player' ? 'score' : 'fail');
            
            if (winner === 'player') {
                state.pScore++; spawnTextVFX("+1", "#0ff"); printMsg(reason || "СИСТЕМА ПРОБИТА");
                triggerBotTaunt('lose_point');
            } else {
                state.aScore++; spawnTextVFX("ERR", "#f0f"); printMsg(reason || "ОШИБКА", true); vibrate(100);
                triggerBotTaunt('win_point');
            }
            updateScoreUI();

            if ((state.pScore >= 11 && state.pScore - state.aScore >= 2) || (state.aScore >= 11 && state.aScore - state.pScore >= 2)) {
                setTimeout(() => {
                    elGameUI.style.display = 'none'; elGameOver.classList.remove('hidden'); elGameOver.style.display = 'flex';
                    let isWin = winner === 'player';
                    document.getElementById('result-title').textContent = isWin ? "СИСТЕМА ВЗЛОМАНА" : "ОТКАЗ В ДОСТУПЕ";
                    document.getElementById('result-title').style.color = isWin ? '#0ff' : '#f0f';
                    document.getElementById('result-desc').textContent = isWin ? "Победа над ИИ." : "Тренируй нейронные связи, органика.";
                }, 1500);
            } else {
                state.server = getNextServer();
                setTimeout(resetBall, 1500);
            }
        }

        function performHit(isPlayer, isServe = false) {
            state.status = 'playing';
            state.bounces = 0;
            state.lastHitSide = isPlayer ? 'player' : 'ai';
            state.isServeHit = isServe;
            state.isSmash = false;
            
            let sign = isPlayer ? -1 : 1;
            playSound('hit');

            if (isServe) {
                let time = 0.35; 
                let targetX = (Math.random() - 0.5) * TABLE_W * 0.5; 
                let targetZ = isPlayer ? (TABLE_L / 4) : -(TABLE_L / 4); 
                
                state.vel.x = (targetX - state.ball.x) / time;
                state.vel.z = (targetZ - state.ball.z) / time;
                state.vel.y = (TABLE_H - state.ball.y - 0.5 * GRAVITY * time * time) / time;
                
                trailMat.color.setHex(isPlayer ? 0x00ffff : 0xff00ff);
                ballMat.color.setHex(isPlayer ? 0x00ffff : 0xff00ff);
            } else {
                let time = currentDiff.ballTime;
                let targetZ = sign * (TABLE_L / 4 + Math.random() * (TABLE_L/4));
                let targetX = (Math.random() - 0.5) * (TABLE_W * 0.8);
                let targetY = TABLE_H; 
                let ay = GRAVITY;

                if (isPlayer && state.isSmashReady) {
                    time = 0.25; state.isSmash = true; ay = -5;
                    state.isSmashReady = false;
                } else if (!isPlayer && currentDiff.id === 2 && Math.random() > 0.8) {
                    time = 0.3; state.isSmash = true; ay = -6;
                }

                state.vel.x = (targetX - state.ball.x) / time;
                state.vel.z = (targetZ - state.ball.z) / time;
                state.vel.y = (targetY - state.ball.y - 0.5 * ay * time * time) / time;

                if (state.isSmash) {
                    vibrate(50);
                    trailMat.color.setHex(0xff0000); ballMat.color.setHex(0xff0000);
                    spawnTextVFX("OVERCLOCK!", "#f00", true);
                } else {
                    trailMat.color.setHex(isPlayer ? 0x00ffff : 0xff00ff); ballMat.color.setHex(isPlayer ? 0x00ffff : 0xff00ff);
                }
            }
        }

        const clock = new THREE.Clock();
        
        function update(dt) {
            gridHelper.position.z = (gridHelper.position.z + dt * 0.5) % 1; 

            const t = clock.getElapsedTime();
            
            if (cameraShakeAmount > 0) {
                camera.position.x = (Math.random() - 0.5) * cameraShakeAmount;
                camera.position.y = 3 + (Math.random() - 0.5) * cameraShakeAmount;
                if (tableGroupRef) {
                    tableGroupRef.position.x = (Math.random() - 0.5) * (cameraShakeAmount * 0.5);
                    tableGroupRef.position.z = (Math.random() - 0.5) * (cameraShakeAmount * 0.5);
                }
                cameraShakeAmount -= dt * 0.8;
                if (cameraShakeAmount < 0) {
                    cameraShakeAmount = 0;
                    if (tableGroupRef) { tableGroupRef.position.x = 0; tableGroupRef.position.z = 0; }
                }
            }

            spec1.group.position.y = (TABLE_H - 1.2) + Math.sin(t * 3) * 0.03;
            spec2.group.position.y = (TABLE_H - 1.2) + Math.cos(t * 3.5) * 0.03;
            updateSpectatorBubbles(dt);

            lampRig.rotation.z = Math.sin(t * 1.5) * 0.05;
            lampRig.rotation.x = Math.cos(t * 1.1) * 0.02;
            
            if (Math.random() > 0.95) {
                mainLight.intensity = 1.8 + Math.random() * 0.5;
                bulb.material.color.setHSL(0.5, 1, 0.4 + Math.random() * 0.3);
            } else {
                mainLight.intensity = THREE.MathUtils.lerp(mainLight.intensity, 2.5, 10 * dt);
                bulb.material.color.setHSL(0.5, 1, 0.9);
            }

            state.targetX = THREE.MathUtils.lerp(state.targetX, rawPointerX, 15 * dt);
            state.targetY = THREE.MathUtils.lerp(state.targetY, rawPointerY, 15 * dt);
            
            paddlePlayer.position.x = state.targetX;
            paddlePlayer.position.y = state.targetY;
            
            let tiltZ = (paddlePlayer.position.x - rawPointerX) * 2; 
            let flipY = state.targetX > 0 ? -0.3 : 0.3; 
            paddlePlayerPivot.rotation.z = THREE.MathUtils.lerp(paddlePlayerPivot.rotation.z, tiltZ, 10 * dt);
            paddlePlayerPivot.rotation.y = THREE.MathUtils.lerp(paddlePlayerPivot.rotation.y, flipY, 10 * dt);
            paddlePlayerPivot.rotation.x = THREE.MathUtils.lerp(paddlePlayerPivot.rotation.x, (state.status === 'playing' && state.vel.z > 0) ? -0.3 : 0, 10 * dt);

            if (state.status === 'playing' && state.vel.z < 0) {
                let errX = (Math.random() - 0.5) * currentDiff.aiMiss;
                state.aiTargetX = state.ball.x + errX;
                state.aiTargetY = Math.max(TABLE_H + 0.2, state.ball.y);
            } else {
                state.aiTargetX = THREE.MathUtils.lerp(state.aiTargetX, 0, 2 * dt); 
                state.aiTargetY = THREE.MathUtils.lerp(state.aiTargetY, TABLE_H + 0.3, 2 * dt);
            }
            
            currentOpponent.group.position.x = THREE.MathUtils.lerp(currentOpponent.group.position.x, state.aiTargetX * 0.5, currentDiff.aiSpeed * dt);
            currentOpponent.group.rotation.y = THREE.MathUtils.lerp(currentOpponent.group.rotation.y, (state.aiTargetX * 0.1), 10 * dt);

            paddleAi.position.x = THREE.MathUtils.lerp(paddleAi.position.x, state.aiTargetX, currentDiff.aiSpeed * dt);
            paddleAi.position.y = THREE.MathUtils.lerp(paddleAi.position.y, state.aiTargetY, currentDiff.aiSpeed * dt);
            paddleAiPivot.rotation.y = state.aiTargetX > 0 ? 0.3 : -0.3;
            paddleAiPivot.rotation.x = THREE.MathUtils.lerp(paddleAiPivot.rotation.x, (state.status === 'playing' && state.vel.z < 0) ? 0.3 : 0, 10 * dt);

            if (state.status === 'playing' || state.status === 'serve_toss') {
                let ay = (state.status === 'playing' && state.isSmash && !state.isServeHit) ? -5 : GRAVITY;
                state.vel.y += ay * dt;
                state.ball.addScaledVector(state.vel, dt);
                ball.position.copy(state.ball);

                if (state.ball.y - BALL_RAD < TABLE_H && state.vel.y < 0) {
                    if (Math.abs(state.ball.x) < TABLE_W/2 && Math.abs(state.ball.z) < TABLE_L/2) {
                        state.ball.y = TABLE_H + BALL_RAD;
                        state.vel.y = Math.abs(state.vel.y) * 0.85; 
                        
                        playSound('bounce'); vibrate(15);
                        cameraShakeAmount = 0.05;
                        
                        state.bounces++;
                        let bounceSide = state.ball.z > 0 ? 'player' : 'ai';
                        
                        if (state.isServeHit) {
                            if (state.bounces === 1) {
                                if (bounceSide !== state.lastHitSide) scorePoint(bounceSide, "ОШИБКА ПОДАЧИ: НЕТ КАСАНИЯ СВОЕЙ ЗОНЫ");
                            } else if (state.bounces === 2) {
                                if (bounceSide === state.lastHitSide) scorePoint(bounceSide === 'player' ? 'ai' : 'player', "ДАБЛ-БАУНС НА СВОЕЙ ЗОНЕ");
                            } else if (state.bounces === 3) {
                                scorePoint(bounceSide === 'player' ? 'ai' : 'player', "ОЧКО!");
                            }
                        } else {
                            if (state.bounces === 1) {
                                if (bounceSide === state.lastHitSide) scorePoint(bounceSide === 'player' ? 'ai' : 'player', "ОШИБКА: ОТСКОК ОТ СВОЕЙ ЗОНЫ");
                            } else if (state.bounces === 2) {
                                scorePoint(bounceSide === 'player' ? 'ai' : 'player', "ДАБЛ-БАУНС!");
                            }
                        }
                    } else if (state.ball.y < TABLE_H - 0.2) {
                        if (state.bounces === 0) {
                            scorePoint(state.lastHitSide === 'player' ? 'ai' : 'player', "АУТ!"); 
                        } else {
                            scorePoint(state.lastHitSide === 'player' ? 'player' : 'ai', "ОЧКО!"); 
                        }
                    }
                }

                if (Math.abs(state.ball.z) < 0.05 && state.ball.y < TABLE_H + 0.15 && state.status === 'playing') {
                    scorePoint(state.lastHitSide === 'player' ? 'ai' : 'player', "УДАР В СЕТКУ");
                    state.vel.x *= 0.2; state.vel.z *= -0.2;
                }

                const HIT_RAD = 0.65;
                
                if (state.vel.z > 0 && state.ball.z > PLAYER_Z - 0.2 && state.bounces > 0) {
                    let dist = Math.hypot(state.ball.x - paddlePlayer.position.x, state.ball.y - paddlePlayer.position.y);
                    if (dist < HIT_RAD) {
                        state.ball.z = PLAYER_Z - 0.2; performHit(true);
                    }
                }

                if (state.vel.z < 0 && state.ball.z < AI_Z + 0.2 && state.bounces > 0) {
                    let dist = Math.hypot(state.ball.x - paddleAi.position.x, state.ball.y - paddleAi.position.y);
                    if (dist < HIT_RAD && Math.random() > currentDiff.aiMiss) {
                        state.ball.z = AI_Z + 0.2; performHit(false);
                    }
                }
                
                if (state.status === 'serve_toss') {
                    let pY = state.server === 'player' ? paddlePlayer.position.y : paddleAi.position.y;
                    if (state.vel.y < 0 && state.ball.y <= pY + 0.15) {
                        performHit(state.server === 'player', true);
                    }
                }

            } else if (state.status === 'serve_wait') {
                if (state.server === 'player') {
                    state.ball.copy(paddlePlayer.position).add(new THREE.Vector3(0, 0.1, -0.1));
                } else {
                    state.ball.copy(paddleAi.position).add(new THREE.Vector3(0, 0.1, 0.1));
                }
                ball.position.copy(state.ball);
            }

            if (state.status === 'playing') {
                for(let i = MAX_TRAIL - 1; i > 0; i--) {
                    trailPos[i*3] = trailPos[(i-1)*3]; trailPos[i*3+1] = trailPos[(i-1)*3+1]; trailPos[i*3+2] = trailPos[(i-1)*3+2];
                }
                trailPos[0] = ball.position.x; trailPos[1] = ball.position.y; trailPos[2] = ball.position.z;
                trailGeo.attributes.position.needsUpdate = true;
            } else {
                trailPos.fill(0); trailGeo.attributes.position.needsUpdate = true;
            }

            renderer.render(scene, camera);
        }

        function animate() { requestAnimationFrame(animate); update(Math.min(clock.getDelta(), 0.05)); }
        
        function handleResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            if (camera.aspect < 1) {
                camera.position.set(0, 4.5, 7.5); 
            } else {
                camera.position.set(0, 3, 5); 
            }
            camera.updateProjectionMatrix(); 
            renderer.setSize(window.innerWidth, window.innerHeight); 
        }
        
        window.addEventListener('resize', handleResize);
        handleResize(); 
        
        animate();
    </script>
</body>
</html>
