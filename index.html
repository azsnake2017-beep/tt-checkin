<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Клуб любителей настольного тенниса ЧМЗ - Диагностика</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Firebase SDK Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

  <style>
    :root {
      --primary: #e11d48;
      --bg: #0b1120;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent-sky: #38bdf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; display: flex; justify-content: center; min-height: 100vh; }
    .container { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 12px; padding-bottom: 40px; }

    /* Панель отладки */
    .debug-panel {
      background: #020617;
      border: 1px solid #ef4444;
      border-radius: 12px;
      padding: 10px;
      font-family: monospace;
      font-size: 11px;
      color: #38bdf8;
      max-height: 150px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .debug-log { border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 2px; }
    .debug-error { color: #f87171; font-weight: bold; }

    .club-header {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      background: var(--card-bg); border: 1px solid var(--card-border); padding: 12px 14px; border-radius: 16px;
    }
    .club-logo { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; background: #0b1120; border: 2px solid var(--accent-sky); }
    .club-header-text h1 { font-size: 14px; font-weight: 700; color: #f8fafc; }
    .club-header-text p { font-size: 11px; color: var(--text-muted); }

    .profile-card {
      background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;
    }
    .btn { width: 100%; border: none; padding: 12px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; text-align: center; background: var(--primary); color: #fff; }
  </style>
</head>
<body>

<div class="container">

  <!-- Панель вывода логов диагностики -->
  <div class="debug-panel" id="debug-box">
    <div class="debug-log">🚀 Старт загрузки страницы...</div>
  </div>

  <div class="club-header">
    <div style="display: flex; align-items: center; gap: 12px;">
      <img src="logo.webp" alt="ЧМЗ" class="club-logo" width="48" height="48" onerror="logDebug('⚠️ Ошибка загрузки логотипа logo.webp')">
      <div class="club-header-text">
        <h1>Клуб настольного тенниса ЧМЗ</h1>
        <p>Режим диагностики</p>
      </div>
    </div>
  </div>

  <div class="profile-card">
    <div id="user-name-container">
      <span>Вы: <b style="color: var(--text-muted);">Инициализация...</b></span>
    </div>
  </div>

  <button class="btn" onclick="runManualCheck()">Запустить проверку вручную</button>

</div>

<script>
  function logDebug(msg, isErr = false) {
    const box = document.getElementById('debug-box');
    if (!box) return;
    const div = document.createElement('div');
    div.className = isErr ? 'debug-log debug-error' : 'debug-log';
    div.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
    console.log(msg);
  }

  window.onerror = function(msg, url, line) {
    logDebug(`❌ Ошибка JS: ${msg} (стр. ${line})`, true);
  };

  logDebug("📌 Проверка подключения SDK...");
  if (typeof firebase === 'undefined') {
    logDebug("❌ Критично: Библиотека Firebase не загружена!", true);
  } else {
    logDebug("✅ Firebase SDK успешно доступен.");
  }

  const firebaseConfig = {
    apiKey: "AIzaSyA4NIFGbC0xhhykyW0QosrWFJj5eU4bOuY",
    authDomain: "tt-chmz.firebaseapp.com",
    projectId: "tt-chmz",
    storageBucket: "tt-chmz.firebasestorage.app",
    messagingSenderId: "763705864834",
    appId: "1:763705864834:web:d9035408eaf3e31d0efa9b"
  };

  let db;
  try {
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    db = firebase.firestore();
    logDebug("✅ Firebase успешно инициализирован.");
  } catch (e) {
    logDebug(`❌ Ошибка инициализации Firebase: ${e.message}`, true);
  }

  async function runManualCheck() {
    logDebug("🔄 Ручной тест чтения из Firestore...");
    try {
      const doc = await db.collection('locations').doc('park').get();
      if (doc.exists) {
        logDebug("✅ Успешное чтение данных из Firestore!");
      } else {
        logDebug("⚠️ Документ park не найден в базе, но связь работает.");
      }
    } catch (e) {
      logDebug(`❌ Ошибка доступа к Firestore: ${e.message}`, true);
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    logDebug("✅ Событие DOMContentLoaded сработало.");
    
    if (db) {
      logDebug("📌 Подписка на коллекцию locations/park...");
      db.collection('locations').doc('park').onSnapshot(doc => {
        logDebug("✅ Данные locations получены в реальном времени.");
      }, err => {
        logDebug(`❌ Ошибка в onSnapshot: ${err.message}`, true);
      });
    }
  });
</script>

</body>
</html>
